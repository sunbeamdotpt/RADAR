# Secrets flow: OpenBao → VaultDynamicSecret → K8s Secret → Pod env.
# The OpenBao database static role `static-creds/radar` and the radar_db
# database/user on the CNPG cluster are provisioned out of band (see
# docs/KUBERNETES.md) — mirroring how kanban/goalert are wired.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-auth
  namespace: radar
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: vso
    serviceAccount: default
---
# RADAR DB credentials from the OpenBao database secrets engine
# (static role, rotated by OpenBao; VSO refreshes every 5m).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: radar-db-creds
  namespace: radar
spec:
  vaultAuthRef: vso-auth
  mount: database
  path: static-creds/radar
  allowStaticCreds: true
  refreshAfter: 5m
  rolloutRestartTargets:
    - kind: Deployment
      name: radar-api
  destination:
    name: radar-db-creds
    create: true
    overwrite: true
    transformation:
      excludeRaw: true
      templates:
        dsn:
          text: "postgresql://{{ index .Secrets \"username\" }}:{{ index .Secrets
            \"password\" }}@postgres-rw.data.svc.cluster.local:5432/radar_db?sslmode=disable"
