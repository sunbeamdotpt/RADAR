apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: radar

resources:
  - namespace.yaml
  - config.yaml
  - vault-secrets.yaml
  - api-deployment.yaml
  - api-service.yaml
  - job-cronjob.yaml
  - assess-cronjob.yaml
  - dryrun-rbac.yaml
  - dryrun-cronjob.yaml

# Short image names — the registry is wired here. Using GHCR while the sbbb OCI
# registry is not available; replace with oci.DOMAIN_SUFFIX/studio/... when ready.
images:
  - name: sunbeam-radar-api
    newName: ghcr.io/sunbeamdotpt/radar-api
    newTag: latest
  - name: sunbeam-radar-job
    newName: ghcr.io/sunbeamdotpt/radar-job
    newTag: latest
  - name: sunbeam-radar-dryrun
    newName: ghcr.io/sunbeamdotpt/radar-dryrun
    newTag: latest
