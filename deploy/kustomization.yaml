apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: radar

resources:
  - namespace.yaml
  - config.yaml
  - vault-secrets.yaml
  - api-deployment.yaml
  - api-service.yaml
  - job-cronjob.yaml
  - assess-cronjob.yaml
  - dryrun-rbac.yaml
  - dryrun-cronjob.yaml

# Short image names — the registry is wired here, matching sbbb conventions.
images:
  - name: sunbeam-radar-api
    newName: oci.DOMAIN_SUFFIX/studio/sunbeam-radar-api
    newTag: latest
  - name: sunbeam-radar-job
    newName: oci.DOMAIN_SUFFIX/studio/sunbeam-radar-job
    newTag: latest
  - name: sunbeam-radar-dryrun
    newName: oci.DOMAIN_SUFFIX/studio/sunbeam-radar-dryrun
    newTag: latest
