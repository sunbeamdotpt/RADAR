# Non-secret configuration shared by the API Deployment and the inventory CronJob.
# DOMAIN_SUFFIX is substituted at deploy time (sunbeam service apply).
apiVersion: v1
kind: ConfigMap
metadata:
  name: radar-config
  namespace: radar
data:
  STORAGE: "postgres"
  DOMAIN_SUFFIX: "DOMAIN_SUFFIX"
  GIT_BASE_URL: "https://github.com/sunbeamdotpt/sbbb.git"
  GIT_BASE_REF: "mainline"
  GIT_BASE_REQUIRED: "true"
  RADAR_AUTO_DETECT: "false"
  RADAR_DASHBOARD_ENABLED: "true"
  RADAR_GRAFANA_URL: ""
  PORT: "8080"
  # OpenTelemetry: OTLP export of traces, metrics, and logs. Override the
  # endpoint per cluster to point at your collector (e.g. Grafana Alloy).
  OTEL_DENO: "true"
  OTEL_SERVICE_NAME: "radar"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
