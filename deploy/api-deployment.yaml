apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar-api
  namespace: radar
  labels:
    sunbeam.pt/service: radar
    sunbeam.pt/category: tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radar-api
  template:
    metadata:
      labels:
        app: radar-api
    spec:
      # default SA with token mounted: VSO authenticates the pod for radar-db-creds.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radar-api
          image: sunbeam-radar-api
          envFrom:
            - configMapRef:
                name: radar-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: radar-db-creds
                  key: dsn
          livenessProbe:
            httpGet:
              path: /__lbheartbeat__
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /__heartbeat__
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              memory: 256Mi
              cpu: 250m
            requests:
              memory: 64Mi
              cpu: 50m
