# Inventory job. Suspended by default: trigger manually with
#   kubectl -n radar create job --from=cronjob/radar-inventory radar-inventory-manual
# Un-suspend for a schedule, or let wfe invoke the same image/command later.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: radar-inventory
  namespace: radar
  labels:
    sunbeam.pt/service: radar
    sunbeam.pt/category: tools
spec:
  # Off-peak, herd-avoiding minute; 4x/day keeps upstream version data fresh.
  schedule: "23 */6 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: radar-job
        spec:
          # default SA with token mounted: VSO authenticates the pod for radar-db-creds.
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: radar-job
              image: sunbeam-radar-job
              envFrom:
                - configMapRef:
                    name: radar-config
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: radar-db-creds
                      key: dsn
              resources:
                limits:
                  memory: 512Mi
                  cpu: 500m
                requests:
                  memory: 128Mi
                  cpu: 100m
