# Auto-detection suppression list (RADAR_AUTO_DETECT). Entries match a scanned
# component's upstream or name exactly and are never auto-added. Only gates
# auto-detection — curated components below are always kept.
#
# These are short-name images from base/ manifests whose real registry is only
# bound in overlay `images:` sections; the scanner would misclassify them as
# Docker Hub repos (where they 404). Most are curated below with their proper
# upstream; the rest are untrackable utility images.
ignore:
  - busybox
  - doc
  - kanban
  - keygen
  - livekit-meet
  - nats-box
  - nats-callout
  - openfga
  - opensign
  - opensignserver
  - plasmic-wab
  - sso-gateway
  - sso-ui
  - wiki
  - zendrite

